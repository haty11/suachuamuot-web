<style>
/* Layout: dark berry sidebar + work surface; summary first, detail in a right drawer. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#E27C97; --accent-soft:#3D1F29; --accent-ink:#22090F;
  --side:#0F0A0C; --side-ink:#F3DDE3; --side-muted:#A07D88; --side-hi:#2C1820;
  --good:#79C487; --good-soft:#1B2E1F; --warn:#E5AE52; --warn-soft:#33260F; --bad:#F2837A; --bad-soft:#3A1A18; --info:#86B6E0; --info-soft:#16263A;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171013; --surface:#21171B; --sunk:#1C1317; --ink:#F3E6EA; --muted:#B49BA3; --line:#3A2A31;
  --accent:#E27C97; --accent-soft:#3D1F29; --accent-ink:#22090F;
  --side:#0F0A0C; --side-ink:#F3DDE3; --side-muted:#A07D88; --side-hi:#2C1820;
  --good:#79C487; --good-soft:#1B2E1F; --warn:#E5AE52; --warn-soft:#33260F; --bad:#F2837A; --bad-soft:#3A1A18; --info:#86B6E0; --info-soft:#16263A;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--side)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 26px/1.2 var(--display)}
h2{font:700 18px/1.3 var(--display)}
h3{font:600 15px/1.35 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.brand b{font:800 21px/1.1 var(--display);letter-spacing:.01em}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-hi)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}
.nav a .ct{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:0 7px}
.nav a.on .ct{background:rgba(0,0,0,.18)}
.nav svg{width:18px;height:18px;flex:none}
.navlbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:8px 10px 2px}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 10px;display:flex;flex-direction:column;gap:8px}
.side .foot button{background:none;border:1px solid var(--side-hi);color:var(--side-ink);border-radius:8px;padding:6px 8px;cursor:pointer;text-align:left}
.main{min-width:0;padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.topbar{display:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:2px 0 0;color:var(--muted)}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 10px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:var(--sunk)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi{gap:4px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font:700 26px/1.15 var(--display)}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hot{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--surface)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{color:var(--good);background:var(--good-soft)}.p-warn{color:var(--warn);background:var(--warn-soft)}.p-bad{color:var(--bad);background:var(--bad-soft)}.p-info{color:var(--info);background:var(--info-soft)}.p-mute{color:var(--muted);background:var(--sunk)}.p-acc{color:var(--accent);background:var(--accent-soft)}
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
.sub{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:700;margin-left:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.inp{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;min-width:0}
textarea.inp{padding:8px 12px;min-height:72px;width:100%;resize:vertical}
.inp.num{width:96px;text-align:right}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.todo{display:flex;flex-direction:column}
.todo a{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.todo a:last-child{border-bottom:0}
.todo a:hover .t{color:var(--accent)}
.todo .dot{width:8px;height:8px;border-radius:50%;flex:none}
.todo .t{flex:1;min-width:0}
.bars{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pl{display:flex;flex-direction:column}
.pl div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.pl div.t{font-weight:700;border-bottom:0;border-top:1px solid var(--ink);margin-top:4px;padding-top:9px}
.pl div.ind span:first-child{padding-left:14px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:999px}
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(20,8,12,.42)}
.drawer .panel{width:min(560px,100%);height:100%;background:var(--bg);overflow:auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 40px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.drawer .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.x{border:0;background:var(--surface);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px;flex:none}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.steps span.done{background:var(--good-soft);color:var(--good)}
.steps span.cur{background:var(--accent);color:var(--accent-ink)}
.msg{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;font-size:13px}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.note{font-size:12px;color:var(--muted)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:20px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.mcards{display:none}
.schema h3{font-family:var(--display);font-size:16px}
.schema code{font-size:12px;background:var(--sunk);padding:1px 6px;border-radius:6px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){

  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .hide-m{display:none}
  .mcards{display:flex;flex-direction:column;gap:8px}
  .dtable{display:none}
  h1{font-size:22px}

@media (max-width:420px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .v{font-size:21px}}
#gate{position:fixed;inset:0;z-index:70;background:var(--side);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gbox{background:var(--surface);color:var(--ink);border-radius:20px;padding:28px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.gbox .gbrand{font:800 26px/1.1 var(--display);color:var(--accent)}
.gbox p{margin:0}
.sug{position:absolute;top:100%;left:0;right:0;z-index:5;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sug button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font:inherit;color:var(--ink);cursor:pointer}
.sug button+button{border-top:1px solid var(--line)}
.sug button:hover,.sug button:focus-visible{background:var(--sunk)}
.sug small{color:var(--muted);font-size:12.5px}
.mapf{display:block;width:100%;height:210px;border:0;border-radius:12px;background:var(--sunk)}
#gate.ld{background:var(--side)}
#gate.ld .gbox{background:transparent;box-shadow:none;align-items:center;text-align:center}
#gate.ld .gbox .gbrand,#gate.ld .gbox .sub{display:none}
.ldr{display:flex;flex-direction:column;align-items:center;gap:14px}
.ava{width:76px;height:76px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--accent),0 10px 24px rgba(0,0,0,.35);animation:nay .9s cubic-bezier(.3,0,.4,1) infinite alternate}
.ava0{display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font:800 32px/1 var(--display)}
.ldt{color:var(--side-ink);font-weight:600;letter-spacing:.02em}
@keyframes nay{0%{transform:translateY(0) scale(1,1)}80%{transform:translateY(-22px) scale(.97,1.03)}100%{transform:translateY(-26px) scale(1,1)}}
@media (prefers-reduced-motion:reduce){.ava{animation:none}}
.steps-ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps-ol code{background:var(--sunk);padding:1px 6px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
